# Compose puts these two services on a network of their own and registers each
# under its service name, which is why `db` below resolves. Two separate
# `docker run` commands land on the default network, where it would not.

services:
  snake:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://snake:snakepw@db:5432/snake
      IMAGE_TAG: snake:compose
    depends_on:
      db:
        # The application retries anyway, but waiting keeps the output clean.
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snake
      POSTGRES_PASSWORD: snakepw
      POSTGRES_DB: snake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake"]
      interval: 2s
      timeout: 3s
      retries: 15
    # No volume, so `docker compose down` takes the data with it.
