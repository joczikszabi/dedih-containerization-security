# Block 5. Cut the application off from the database without touching either.
#
# A NetworkPolicy is allow-list based. This one selects the postgres pods and
# permits ingress from nothing at all, so the application's connections start
# failing and the status panel turns amber within a few seconds.
#
# Delete it and the panel goes green again on its own, because the application
# keeps retrying. Neither pod was restarted and no code changed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress: []
