# Selects the postgres pods and permits ingress from nothing.
#
# Applying this does not cut off the running application: a NetworkPolicy
# governs new connections, and the existing pooled one keeps working. The
# application only loses the database after its pods are restarted and have to
# connect again.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress: []
